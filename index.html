<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>


    <style>
        body {
           
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }


        .calculadora {
           
            padding: 16px;
            border-radius: 9px;
            width: 184px;
        }


        h2 {
            text-align: center;
            font-size: 21px;
            margin-bottom: 14px;
        }


        input {
            width: 100%;
            box-sizing: border-box;
            padding: 7px;
            margin-bottom: 7px;
            border: 1px solid #ccc;
        }


        .botoes {
            display: flex;
            gap: 5px;
        }


        button {
            flex: 1;
            padding: 7px 0;
            cursor: pointer;
            background-color: #eee;
        }


        button:hover {
            background-color: #ddd;
        }


        .limpar {
            margin-top: 7px;
            padding: 7px;
        }


        p {
            font-size: 12px;
            font-weight: bold;
            margin-top: 14px;
            overflow-wrap: anywhere;
        }
    </style>
</head>


<body>


    <div class="calculadora">
        <h2>Calculadora</h2>


        <input type="number" id="num1" placeholder="Primeiro número">
        <input type="number" id="num2" placeholder="Segundo número">


        <div class="botoes">
            <button onclick="calcular('+')">+</button>
            <button onclick="calcular('-')">-</button>
            <button onclick="calcular('*')">×</button>
            <button onclick="calcular('/')">÷</button>
        </div>


        <button class="limpar" onclick="limpar()">Limpar</button>


        <p>Resultado: <span id="resultado"></span></p>
    </div>


    <script>
        function calcular(operador) {
            let campo1 = document.getElementById("num1").value;
            let campo2 = document.getElementById("num2").value;


            if (campo1 === "" || campo2 === "") {
                document.getElementById("resultado").innerText =
                    "Digite os dois números!";
                return;
            }


            let num1 = Number(campo1);
            let num2 = Number(campo2);
            let resultado;


            if (operador === "+") {
                resultado = num1 + num2;
            } else if (operador === "-") {
                resultado = num1 - num2;
            } else if (operador === "*") {
                resultado = num1 * num2;
            } else if (operador === "/") {
                if (num2 === 0) {
                    document.getElementById("resultado").innerText =
                        "Não divide por zero!";
                    return;
                }
                resultado = num1 / num2;
            }


            document.getElementById("resultado").innerText = resultado;
        }


        function limpar() {
            document.getElementById("num1").value = "";
            document.getElementById("num2").value = "";
            document.getElementById("resultado").innerText = "";
        }
    </script>


</body>
</html>
